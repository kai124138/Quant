[project]
name = "lob-latency"
version = "0.1.0"
description = "Latency-aware limit order book prediction: decay of predictive skill with input delay"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_latency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
